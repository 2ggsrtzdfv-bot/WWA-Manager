<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >

  <meta name="theme-color" content="#17233b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta name="apple-mobile-web-app-title" content="WWA Manager">

  <title>WWA Manager</title>

  <style>
    :root {
      --ink: #17233b;
      --blue: #79afe0;
      --paper: #f7f7f3;
      --white: #ffffff;
      --line: #dfe4ec;
      --muted: #707887;
      --ok: #2d7a4c;
      --warn: #9a6c00;
      --violet: #6d4a8a;
      --danger: #b44a4a;
      --shadow: 0 10px 30px rgba(23, 35, 59, 0.09);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
    }

    body {
      overscroll-behavior-y: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      min-height: 46px;
      padding: 11px 15px;
      border: 0;
      border-radius: 14px;
      background: var(--ink);
      color: var(--white);
      font-weight: 800;
      cursor: pointer;
    }

    button.secondary,
    .file-button {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--ink);
    }

    button.danger {
      background: var(--danger);
    }

    button:disabled {
      opacity: 0.45;
    }

    .app {
      width: min(100%, 780px);
      margin: auto;
      padding:
        calc(16px + env(safe-area-inset-top))
        14px
        calc(100px + env(safe-area-inset-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin:
        calc(-16px - env(safe-area-inset-top))
        -14px
        14px;
      padding:
        calc(14px + env(safe-area-inset-top))
        14px
        12px;
      border-bottom: 1px solid rgba(223, 228, 236, 0.8);
      background: rgba(247, 247, 243, 0.92);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--white);
      font-size: 12px;
      font-weight: 900;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 132px;
      gap: 9px;
      margin-bottom: 12px;
    }

    .control {
      width: 100%;
      min-height: 48px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: var(--white);
      color: var(--ink);
      font-size: 16px;
    }

    .control:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(121, 175, 224, 0.2);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 14px;
    }

    .stat {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .stat strong {
      display: block;
      font-size: 25px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .card-main {
      display: flex;
      gap: 12px;
      min-width: 0;
    }

    .thumb {
      width: 78px;
      height: 78px;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #eef2f7;
      object-fit: cover;
    }

    .thumb.placeholder {
      display: grid;
      place-items: center;
      font-size: 28px;
    }

    .copy {
      min-width: 0;
    }

    .copy h2 {
      margin: 2px 0 6px;
      overflow-wrap: anywhere;
      font-size: 17px;
      line-height: 1.3;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .badge {
      height: max-content;
      padding: 7px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .collecting {
      background: #eef4fb;
      color: #366f9e;
    }

    .designing {
      background: #f4f0fa;
      color: var(--violet);
    }

    .review {
      background: #fff7e7;
      color: var(--warn);
    }

    .complete {
      background: #eaf6ec;
      color: var(--ok);
    }

    .progress {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 13px;
    }

    .track {
      height: 9px;
      flex: 1;
      overflow: hidden;
      border-radius: 999px;
      background: #e9edf2;
    }

    .bar {
      display: block;
      height: 100%;
      background: var(--blue);
    }

    .pct {
      width: 38px;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .empty {
      padding: 50px 20px;
      border: 1px dashed #c9d0dc;
      border-radius: 20px;
      background: var(--white);
      color: var(--muted);
      text-align: center;
    }

    .utility {
      display: flex;
      gap: 9px;
      margin-top: 15px;
    }

    .file-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 11px 15px;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    dialog {
      width: min(720px, 100vw);
      max-width: 100vw;
      height: min(94dvh, 900px);
      max-height: 94dvh;
      margin: auto;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 24px 24px 0 0;
      background: var(--white);
      box-shadow: 0 30px 100px rgba(23, 35, 59, 0.35);
    }

    dialog::backdrop {
      background: rgba(23, 35, 59, 0.58);
      backdrop-filter: blur(4px);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: var(--ink);
      color: var(--white);
    }

    .modal-head h2 {
      margin: 0;
      font-size: 19px;
    }

    .modal-body {
      height: calc(94dvh - 70px);
      overflow-y: auto;
      padding:
        16px
        calc(16px + env(safe-area-inset-right))
        calc(100px + env(safe-area-inset-bottom))
        calc(16px + env(safe-area-inset-left));
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .field textarea {
      min-height: 100px;
      resize: vertical;
    }

    .section {
      margin-top: 23px;
    }

    .section h3 {
      margin: 0 0 10px;
      font-size: 17px;
    }

    .note {
      margin: -3px 0 11px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .check-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 46px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #f7f9fc;
      font-size: 13px;
    }

    .check input {
      width: 20px;
      height: 20px;
    }

    .asset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .asset {
      padding: 10px;
      border: 1px dashed #c9d0dc;
      border-radius: 16px;
      background: #fbfcfe;
    }

    .asset img {
      display: none;
      width: 100%;
      height: 145px;
      border-radius: 11px;
      background: #eef2f7;
      object-fit: cover;
    }

    .asset strong {
      display: block;
      margin: 9px 0 7px;
      font-size: 13px;
    }

    .asset input {
      width: 100%;
      font-size: 12px;
    }

    .asset .remove {
      width: 100%;
      min-height: 38px;
      margin-top: 8px;
      padding: 7px 9px;
      font-size: 12px;
    }

    .sticky-actions {
      position: sticky;
      bottom: calc(-100px - env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin:
        24px
        -16px
        calc(-100px - env(safe-area-inset-bottom));
      padding:
        12px
        16px
        calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
    }

    .right {
      display: flex;
      gap: 8px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom));
      z-index: 100;
      padding: 11px 15px;
      border-radius: 999px;
      background: rgba(23, 35, 59, 0.94);
      color: var(--white);
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 20px);
      transition: 0.2s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 560px) {
      .toolbar,
      .form-grid,
      .check-grid,
      .asset-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .brand p {
        display: none;
      }

      .stats {
        grid-template-columns: repeat(3, 1fr);
      }

      .stat {
        padding: 12px;
      }

      .stat strong {
        font-size: 22px;
      }

      dialog {
        align-self: end;
        margin: auto 0 0;
        border-radius: 24px 24px 0 0;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark">WWA</div>

        <div>
          <h1>WWA Manager</h1>
          <p>Wizarding World LEGO Archive · v0.3</p>
        </div>
      </div>

      <button id="addBtn" type="button">+ 추가</button>
    </header>

    <section class="toolbar">
      <input
        id="search"
        class="control"
        type="search"
        placeholder="세트번호 또는 세트명 검색"
      >

      <select id="filter" class="control">
        <option value="">전체 상태</option>
        <option value="collecting">자료수집</option>
        <option value="designing">제작중</option>
        <option value="review">검토중</option>
        <option value="complete">완료</option>
      </select>
    </section>

    <section class="stats">
      <div class="stat">
        <strong id="total">0</strong>
        <span>총 세트</span>
      </div>

      <div class="stat">
        <strong id="active">0</strong>
        <span>진행 중</span>
      </div>

      <div class="stat">
        <strong id="done">0</strong>
        <span>완료</span>
      </div>
    </section>

    <section id="list" class="list"></section>

    <div class="utility">
      <button id="backup" class="secondary" type="button">
        백업
      </button>

      <label class="file-button" for="restore">
        복원
      </label>

      <input
        id="restore"
        type="file"
        accept=".json,application/json"
        hidden
      >
    </div>
  </main>

  <dialog id="dialog">
    <div class="modal-head">
      <h2 id="dialogTitle">세트 추가</h2>

      <button id="close" class="secondary" type="button">
        닫기
      </button>
    </div>

    <form id="form" class="modal-body">
      <input id="editId" type="hidden">

      <div class="form-grid">
        <div class="field">
          <label for="setNumber">세트번호</label>
          <input
            id="setNumber"
            class="control"
            required
            inputmode="numeric"
            placeholder="예: 76417"
          >
        </div>

        <div class="field">
          <label for="setName">세트명</label>
          <input
            id="setName"
            class="control"
            required
            placeholder="예: 그린고트 마법 은행"
          >
        </div>

        <div class="field">
          <label for="releaseDate">출시일</label>
          <input
            id="releaseDate"
            class="control"
            type="date"
          >
        </div>

        <div class="field">
          <label for="retailPrice">출시 정가(₩)</label>
          <input
            id="retailPrice"
            class="control"
            type="number"
            inputmode="numeric"
            min="0"
            step="100"
          >
        </div>

        <div class="field">
          <label for="pieceCount">피스 수</label>
          <input
            id="pieceCount"
            class="control"
            type="number"
            inputmode="numeric"
            min="0"
          >
        </div>

        <div class="field">
          <label for="minifigureCount">미니피겨 수</label>
          <input
            id="minifigureCount"
            class="control"
            type="number"
            inputmode="numeric"
            min="0"
          >
        </div>

        <div class="field">
          <label for="dimensions">크기</label>
          <input
            id="dimensions"
            class="control"
            placeholder="예: 32 × 25 × 75 cm"
          >
        </div>

        <div class="field">
          <label for="status">진행 상태</label>
          <select id="status" class="control">
            <option value="collecting">자료수집</option>
            <option value="designing">제작중</option>
            <option value="review">검토중</option>
            <option value="complete">완료</option>
          </select>
        </div>

        <div class="field">
          <label for="purchaseDate">구매일</label>
          <input
            id="purchaseDate"
            class="control"
            type="date"
          >
        </div>

        <div class="field">
          <label for="purchaseStore">구매처</label>
          <input
            id="purchaseStore"
            class="control"
          >
        </div>

        <div class="field">
          <label for="purchasePrice">구매가(₩)</label>
          <input
            id="purchasePrice"
            class="control"
            type="number"
            inputmode="numeric"
            min="0"
            step="100"
          >
        </div>

        <div class="field">
          <label for="buildDate">조립일</label>
          <input
            id="buildDate"
            class="control"
            type="date"
          >
        </div>

        <div class="field full">
          <label for="storageStatus">보관 상태</label>
          <input
            id="storageStatus"
            class="control"
            placeholder="예: 전시 중 / 박스 보관"
          >
        </div>

        <div class="field full">
          <label for="notes">메모</label>
          <textarea
            id="notes"
            class="control"
          ></textarea>
        </div>
      </div>

      <section class="section">
        <h3>자료 체크리스트</h3>
        <div id="checks" class="check-grid"></div>
      </section>

      <section class="section">
        <h3>사진 자료</h3>

        <p class="note">
          사진은 아이폰에서 자동 축소 저장됩니다.
          대표 이미지는 조립 완성 사진 → 박스 사진 순으로 표시됩니다.
        </p>

        <div id="assets" class="asset-grid"></div>
      </section>

      <div class="sticky-actions">
        <button
          id="deleteBtn"
          class="danger"
          type="button"
          hidden
        >
          삭제
        </button>

        <div class="right">
          <button
            id="cancel"
            class="secondary"
            type="button"
          >
            취소
          </button>

          <button type="submit">
            저장
          </button>
        </div>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>

  <script>
    "use strict";

    const STORAGE_KEY = "wwa-manager-v03";

    const OLD_KEYS = [
      "wwa-manager-v02",
      "wwa-manager-v01",
      "wwa-manager-v1"
    ];

    const CHECKS = {
      box: "박스 사진",
      product: "조립 완성 사진",
      detail: "디테일 사진",
      minifigures: "미니피겨",
      blueprint: "가설계도/도면",
      movie: "영화 장면",
      goods: "굿즈",
      page: "페이지 제작",
      review: "검토",
      final: "최종 완료"
    };

    const ASSETS = {
      box: "박스 사진",
      product: "조립 완성 사진",
      detail: "디테일 사진",
      minifigures: "미니피겨",
      blueprint: "가설계도/도면",
      movie: "영화 장면",
      goods: "굿즈"
    };

    const $ = (id) => document.getElementById(id);

    const dialog = $("dialog");
    const form = $("form");

    let sets = load();

    function load() {
      try {
        const current = localStorage.getItem(STORAGE_KEY);

        if (current) {
          return normalize(JSON.parse(current));
        }

        for (const key of OLD_KEYS) {
          const old = localStorage.getItem(key);

          if (!old) {
            continue;
          }

          const parsed = normalize(JSON.parse(old));

          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(parsed)
          );

          return parsed;
        }
      } catch (error) {
        console.error(error);
      }

      return [];
    }

    function normalize(data) {
      if (!Array.isArray(data)) {
        return [];
      }

      const defaultChecklist = Object.fromEntries(
        Object.keys(CHECKS).map((key) => [key, false])
      );

      return data.map((item) => ({
        ...item,

        checklist: {
          ...defaultChecklist,
          ...(item.checklist || {})
        },

        assets: item.assets || {}
      }));
    }

    function persist() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(sets)
        );

        render();
        toast("저장했습니다");
      } catch (error) {
        console.error(error);

        alert(
          "저장 공간이 부족합니다.\n" +
          "백업 후 사용하지 않는 사진을 삭제해 주세요."
        );
      }
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(
        /[&<>"']/g,
        (character) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#039;"
        })[character]
      );
    }

    function statusLabel(status) {
      const labels = {
        collecting: "자료수집",
        designing: "제작중",
        review: "검토중",
        complete: "완료"
      };

      return labels[status] || "자료수집";
    }

    function calculateProgress(item) {
      const values = Object.keys(CHECKS).map(
        (key) => Boolean(item.checklist?.[key])
      );

      const completed = values.filter(Boolean).length;

      return Math.round(
        (completed / values.length) * 100
      );
    }

    function getThumbnail(item) {
      return (
        item.assets?.product ||
        item.assets?.box ||
        item.assets?.detail ||
        ""
      );
    }

    function render() {
      const searchText = $("search")
        .value
        .trim()
        .toLowerCase();

      const selectedStatus = $("filter").value;

      const visibleSets = sets
        .filter((item) => {
          const number = String(
            item.setNumber || ""
          ).toLowerCase();

          const name = String(
            item.setName || ""
          ).toLowerCase();

          const matchesSearch =
            !searchText ||
            number.includes(searchText) ||
            name.includes(searchText);

          const matchesStatus =
            !selectedStatus ||
            item.status === selectedStatus;

          return matchesSearch && matchesStatus;
        })
        .sort((a, b) => {
          return String(a.setNumber).localeCompare(
            String(b.setNumber),
            undefined,
            { numeric: true }
          );
        });

      $("total").textContent = sets.length;

      $("done").textContent = sets.filter(
        (item) => item.status === "complete"
      ).length;

      $("active").textContent = sets.filter(
        (item) => item.status !== "complete"
      ).length;

      if (!visibleSets.length) {
        const message = sets.length
          ? "검색 결과가 없습니다."
          : "등록된 세트가 없습니다.";

        $("list").innerHTML = `
          <div class="empty">
            ${message}
            <br><br>
            <button type="button" id="emptyAdd">
              첫 세트 추가
            </button>
          </div>
        `;

        $("emptyAdd")?.addEventListener(
          "click",
          () => openEditor()
        );

        return;
      }

      $("list").innerHTML = visibleSets
        .map((item) => {
          const progress = calculateProgress(item);
          const thumbnail = getThumbnail(item);

          const thumbnailHtml = thumbnail
            ? `
              <img
                class="thumb"
                src="${thumbnail}"
                alt=""
              >
            `
            : `
              <div class="thumb placeholder">
                🧱
              </div>
            `;

          const pieceText = item.pieceCount
            ? `${Number(item.pieceCount).toLocaleString()} pcs`
            : "피스 수 미입력";

          const figureText =
            `${Number(item.minifigureCount || 0)} figures`;

          return `
            <article class="card">
              <div class="card-top">
                <div class="card-main">
                  ${thumbnailHtml}

                  <div class="copy">
                    <h2>
                      ${escapeHtml(item.setNumber)}
                      ·
                      ${escapeHtml(item.setName)}
                    </h2>

                    <div class="meta">
                      ${pieceText} · ${figureText}
                    </div>
                  </div>
                </div>

                <span
                  class="badge ${escapeHtml(item.status)}"
                >
                  ${statusLabel(item.status)}
                </span>
              </div>

              <div class="progress">
                <div class="track">
                  <span
                    class="bar"
                    style="width: ${progress}%"
                  ></span>
                </div>

                <span class="pct">
                  ${progress}%
                </span>
              </div>

              <div class="card-actions">
                <button
                  class="secondary open"
                  type="button"
                  data-id="${escapeHtml(item.id)}"
                >
                  열기
                </button>
              </div>
            </article>
          `;
        })
        .join("");

      document
        .querySelectorAll(".open")
        .forEach((button) => {
          button.addEventListener(
            "click",
            () => openEditor(button.dataset.id)
          );
        });
    }

    function renderChecks(item) {
      $("checks").innerHTML = Object
        .entries(CHECKS)
        .map(([key, label]) => {
          const checked = item?.checklist?.[key]
            ? "checked"
            : "";

          return `
            <label class="check">
              <input
                type="checkbox"
                data-check="${key}"
                ${checked}
              >

              <span>${label}</span>
            </label>
          `;
        })
        .join("");
    }

    function renderAssets(item) {
      $("assets").innerHTML = Object
        .entries(ASSETS)
        .map(([key, label]) => {
          const source = item?.assets?.[key] || "";
          const display = source
            ? "display: block;"
            : "";

          const disabled = source
            ? ""
            : "disabled";

          return `
            <div class="asset">
              <img
                id="preview-${key}"
                src="${source}"
                alt=""
                style="${display}"
              >

              <strong>${label}</strong>

              <input
                type="file"
                accept="image/*"
                data-asset="${key}"
              >

              <button
                type="button"
                class="secondary remove"
                data-remove="${key}"
                ${disabled}
              >
                이미지 삭제
              </button>
            </div>
          `;
        })
        .join("");

      document
        .querySelectorAll("[data-remove]")
        .forEach((button) => {
          button.addEventListener(
            "click",
            () => {
              const preview = $(
                `preview-${button.dataset.remove}`
              );

              preview.src = "";
              preview.style.display = "none";
              preview.dataset.removed = "1";

              button.disabled = true;
            }
          );
        });
    }

    function setInputValue(id, item, key = id) {
      $(id).value = item?.[key] ?? "";
    }

    function openEditor(id = "") {
      const item = sets.find(
        (set) => set.id === id
      );

      $("dialogTitle").textContent = item
        ? "세트 편집"
        : "세트 추가";

      $("editId").value = item?.id || "";

      const fields = [
        "setNumber",
        "setName",
        "releaseDate",
        "retailPrice",
        "pieceCount",
        "minifigureCount",
        "dimensions",
        "status",
        "purchaseDate",
        "purchaseStore",
        "purchasePrice",
        "buildDate",
        "storageStatus",
        "notes"
      ];

      fields.forEach(
        (field) => setInputValue(field, item)
      );

      if (!item) {
        $("status").value = "collecting";
      }

      $("deleteBtn").hidden = !item;

      renderChecks(item);
      renderAssets(item);

      dialog.showModal();

      setTimeout(
        () => $("setNumber").focus(),
        100
      );
    }

    async function compressImage(file) {
      if (!file.type.startsWith("image/")) {
        throw new Error("이미지 파일이 아닙니다.");
      }

      const dataUrl = await new Promise(
        (resolve, reject) => {
          const reader = new FileReader();

          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;

          reader.readAsDataURL(file);
        }
      );

      const image = await new Promise(
        (resolve, reject) => {
          const element = new Image();

          element.onload = () => resolve(element);
          element.onerror = reject;
          element.src = dataUrl;
        }
      );

      const maximumSize = 1600;

      const scale = Math.min(
        1,
        maximumSize / Math.max(
          image.width,
          image.height
        )
      );

      const canvas = document.createElement("canvas");

      canvas.width = Math.round(
        image.width * scale
      );

      canvas.height = Math.round(
        image.height * scale
      );

      const context = canvas.getContext("2d");

      if (!context) {
        throw new Error(
          "이미지 처리 기능을 사용할 수 없습니다."
        );
      }

      context.drawImage(
        image,
        0,
        0,
        canvas.width,
        canvas.height
      );

      return canvas.toDataURL(
        "image/jpeg",
        0.82
      );
    }

    document.addEventListener(
      "change",
      async (event) => {
        const input = event.target;

        if (
          !input.matches("[data-asset]") ||
          !input.files?.[0]
        ) {
          return;
        }

        try {
          const source = await compressImage(
            input.files[0]
          );

          const preview = $(
            `preview-${input.dataset.asset}`
          );

          preview.src = source;
          preview.style.display = "block";
          preview.dataset.pending = source;

          delete preview.dataset.removed;

          const removeButton = document.querySelector(
            `[data-remove="${input.dataset.asset}"]`
          );

          if (removeButton) {
            removeButton.disabled = false;
          }

          toast("사진을 최적화했습니다");
        } catch (error) {
          console.error(error);

          alert(
            "사진을 처리하지 못했습니다."
          );
        }
      }
    );

    form.addEventListener(
      "submit",
      (event) => {
        event.preventDefault();

        const id = $("editId").value;

        const oldItem = sets.find(
          (item) => item.id === id
        );

        const checklist = {};

        document
          .querySelectorAll("[data-check]")
          .forEach((checkbox) => {
            checklist[checkbox.dataset.check] =
              checkbox.checked;
          });

        const assets = {
          ...(oldItem?.assets || {})
        };

        Object.keys(ASSETS).forEach((key) => {
          const preview = $(`preview-${key}`);

          if (preview.dataset.removed) {
            delete assets[key];
          } else if (preview.dataset.pending) {
            assets[key] = preview.dataset.pending;
          }
        });

        const now = new Date().toISOString();

        const item = {
          id:
            id ||
            crypto.randomUUID?.() ||
            `${Date.now()}-${Math.random()}`,

          setNumber: $("setNumber").value.trim(),
          setName: $("setName").value.trim(),
          releaseDate: $("releaseDate").value,
          retailPrice: $("retailPrice").value,
          pieceCount: $("pieceCount").value,
          minifigureCount: $("minifigureCount").value,
          dimensions: $("dimensions").value.trim(),
          status: $("status").value,
          purchaseDate: $("purchaseDate").value,
          purchaseStore: $("purchaseStore").value.trim(),
          purchasePrice: $("purchasePrice").value,
          buildDate: $("buildDate").value,
          storageStatus: $("storageStatus").value.trim(),
          notes: $("notes").value.trim(),
          checklist,
          assets,
          updatedAt: now,
          createdAt: oldItem?.createdAt || now
        };

        sets = oldItem
          ? sets.map((set) => (
              set.id === id
                ? item
                : set
            ))
          : [item, ...sets];

        persist();
        dialog.close();
      }
    );

    $("deleteBtn").addEventListener(
      "click",
      () => {
        const id = $("editId").value;

        const item = sets.find(
          (set) => set.id === id
        );

        if (!item) {
          return;
        }

        const confirmed = confirm(
          `${item.setNumber} · ${item.setName}\n삭제할까요?`
        );

        if (!confirmed) {
          return;
        }

        sets = sets.filter(
          (set) => set.id !== id
        );

        persist();
        dialog.close();
      }
    );

    $("backup").addEventListener(
      "click",
      () => {
        const backupData = {
          app: "WWA Manager",
          version: 3,
          exportedAt: new Date().toISOString(),
          sets
        };

        const blob = new Blob(
          [
            JSON.stringify(
              backupData,
              null,
              2
            )
          ],
          {
            type: "application/json"
          }
        );

        const link = document.createElement("a");

        link.href = URL.createObjectURL(blob);

        link.download =
          `WWA_Manager_${new Date()
            .toISOString()
            .slice(0, 10)}.json`;

        link.click();

        URL.revokeObjectURL(link.href);

        toast("백업 파일을 만들었습니다");
      }
    );

    $("restore").addEventListener(
      "change",
      async (event) => {
        const file = event.target.files?.[0];

        if (!file) {
          return;
        }

        try {
          const parsed = JSON.parse(
            await file.text()
          );

          const incoming = normalize(
            Array.isArray(parsed)
              ? parsed
              : parsed.sets
          );

          const confirmed = confirm(
            `${incoming.length}개 세트로 ` +
            "현재 데이터를 교체할까요?"
          );

          if (!confirmed) {
            return;
          }

          sets = incoming;
          persist();
        } catch (error) {
          console.error(error);

          alert(
            "올바른 WWA Manager 백업 파일이 아닙니다."
          );
        } finally {
          event.target.value = "";
        }
      }
    );

    function toast(message) {
      const element = $("toast");

      element.textContent = message;
      element.classList.add("show");

      clearTimeout(toast.timer);

      toast.timer = setTimeout(
        () => element.classList.remove("show"),
        1800
      );
    }

    $("addBtn").addEventListener(
      "click",
      () => openEditor()
    );

    $("close").addEventListener(
      "click",
      () => dialog.close()
    );

    $("cancel").addEventListener(
      "click",
      () => dialog.close()
    );

    $("search").addEventListener(
      "input",
      render
    );

    $("filter").addEventListener(
      "change",
      render
    );

    dialog.addEventListener(
      "click",
      (event) => {
        if (event.target === dialog) {
          dialog.close();
        }
      }
    );

    render();
  </script>
</body>
</html>
